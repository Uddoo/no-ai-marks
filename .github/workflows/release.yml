# Publish a release to PyPI: pushing a tag vX.Y.Z runs the tests, checks
# the tag is the package's version, and publishes over GitHub's OIDC,
# trusted publishing: no token is kept anywhere. Moving v0 publishes
# nothing. CONTRIBUTING.md has the steps and the one-time setup.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - name: The tag is the version
        run: |
          v=$(python -c "import no_ai_marks; print(no_ai_marks.__version__)")
          p=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] && [ "$v" = "$p" ] \
            || { echo "tag $GITHUB_REF_NAME, __version__ $v, pyproject.toml $p"; exit 1; }
      - name: Build, and run what was built
        run: |
          python -m venv /tmp/build
          /tmp/build/bin/pip install -q build
          /tmp/build/bin/python -m build --outdir dist
          python -m venv /tmp/use
          /tmp/use/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/use/bin/no-ai-marks --version
          /tmp/use/bin/no-ai-marks tools > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
